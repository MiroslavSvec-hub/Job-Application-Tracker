<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Job Application Tracker</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="wrap">
  <h1>Job application tracker</h1>
  <p class="sub">Track applications, statuses, and next actions — saved to <code>applications.csv</code>.</p>

  <div class="stats" id="stats"></div>

  <div class="panel">
    <h2 id="form-title">Add application</h2>
    <input type="hidden" id="edit-id">
    <div class="grid2">
      <div class="field">
        <label>Company</label>
        <input id="f-company" placeholder="e.g. JPMorganChase">
      </div>
      <div class="field">
        <label>Role</label>
        <input id="f-role" placeholder="e.g. Lead Software Engineer - Python">
      </div>
    </div>
    <div class="grid3">
      <div class="field">
        <label>Date applied</label>
        <input id="f-date" type="date">
      </div>
      <div class="field">
        <label>Status</label>
        <select id="f-status">
          <option value="applied">Applied</option>
          <option value="screening">Screening</option>
          <option value="interview">Interview</option>
          <option value="offer">Offer</option>
          <option value="rejected">Rejected</option>
          <option value="withdrawn">Withdrawn</option>
        </select>
      </div>
      <div class="field">
        <label>Match quality</label>
        <select id="f-match">
          <option value="">Not set</option>
          <option value="low">Low match</option>
          <option value="medium">Medium match</option>
          <option value="strong">Strong match</option>
        </select>
      </div>
    </div>
    <div class="grid2">
      <div class="field">
        <label>Salary range</label>
        <input id="f-salary" placeholder="e.g. £60k–£65k">
      </div>
      <div class="field">
        <label>Job link</label>
        <input id="f-link" placeholder="https://...">
      </div>
    </div>
    <div class="field">
      <label>Reason for match quality</label>
      <textarea id="f-match-reason" placeholder="e.g. Python/Flask stack matches, but GCP preferred over AWS"></textarea>
    </div>
    <div class="field">
      <label>Notes / next action</label>
      <textarea id="f-notes" placeholder="e.g. Follow up 1 week after applying"></textarea>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn-primary" id="save-btn">Add application</button>
      <button id="cancel-btn" style="display:none;">Cancel edit</button>
    </div>
  </div>

  <div class="toolbar">
    <select id="filter-status">
      <option value="all">All statuses</option>
      <option value="applied">Applied</option>
      <option value="screening">Screening</option>
      <option value="interview">Interview</option>
      <option value="offer">Offer</option>
      <option value="rejected">Rejected</option>
      <option value="withdrawn">Withdrawn</option>
    </select>
    <input id="search" placeholder="Search company or role">
  </div>

  <div id="list"></div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
